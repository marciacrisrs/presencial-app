naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'

complexity:
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 6
    ignoreDefaultParameters: true
  LongMethod:
    active: true
    threshold: 60

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
