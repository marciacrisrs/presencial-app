<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Mapa de localização</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <link rel="stylesheet" href="leaflet/leaflet.css"/>
  <script src="leaflet/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
    #map { min-height: 200px; background: #e5e3df; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    function postLocation(lat, lng) {
      window.location.href = 'presencial://location/' + lat + '/' + lng;
    }

    var map;
    var marker;

    function initMap(lat, lng) {
      map = L.map('map', { zoomControl: true }).setView([lat, lng], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
      marker = L.marker([lat, lng], { draggable: true }).addTo(map);
      marker.on('dragend', function(e) {
        var pos = e.target.getLatLng();
        postLocation(pos.lat, pos.lng);
      });
      map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        postLocation(e.latlng.lat, e.latlng.lng);
      });
      requestAnimationFrame(function() {
        map.invalidateSize();
      });
    }

    window.setMarker = function(newLat, newLng) {
      if (!marker || !map) return;
      marker.setLatLng([newLat, newLng]);
      map.setView([newLat, newLng], 16);
    };

    window.invalidateMapSize = function() {
      if (map) map.invalidateSize();
    };

    var params = new URLSearchParams(window.location.search);
    var lat = Number.parseFloat(params.get('lat'));
    var lng = Number.parseFloat(params.get('lng'));
    initMap(Number.isNaN(lat) ? -23.5505 : lat, Number.isNaN(lng) ? -46.6333 : lng);
  </script>
</body>
</html>
