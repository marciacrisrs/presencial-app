name: Android Emulator Runner
description: Pinned wrapper for reactivecircus/android-emulator-runner

inputs:
  api-level:
    description: Android API level for the emulator
    required: true
  arch:
    description: Emulator CPU architecture
    required: false
    default: x86_64
  script:
    description: Command to run after the emulator boots
    required: true

runs:
  using: composite
  steps:
    - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ inputs.api-level }}
        arch: ${{ inputs.arch }}
        target: google_apis
        profile: pixel_5
        cores: 2
        ram-size: 2048M
        heap-size: 512M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-load -no-snapshot-save
        disable-animations: true
        disable-linux-hw-accel: false
        script: ${{ inputs.script }}
