name: Release AAB

# Tag v* ou Actions → Release AAB: bump de versão, AAB assinado e publicação na faixa
# internal da Play (status completed) quando PLAY_STORE_SERVICE_ACCOUNT_JSON estiver configurado.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_verify:
        description: Rodar verifyCi antes do bundle
        type: boolean
        default: true
      skip_play_upload:
        description: Pular envio para teste interno da Play
        type: boolean
        default: false

concurrency:
  group: release-aab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require upload keystore secrets
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name não configurado. Veja docs/release.md (Secrets GitHub)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Bump versionCode / versionName
        id: version
        run: |
          set -euo pipefail
          chmod +x gradlew
          file="version.properties"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            next_name="${GITHUB_REF_NAME#v}"
            IFS='.' read -r maj min pat <<< "$next_name"
            maj=${maj:-0}
            min=${min:-0}
            pat=${pat:-0}
            sed -i -E "s/^VERSION_MAJOR=.*/VERSION_MAJOR=${maj}/" "$file"
            sed -i -E "s/^VERSION_MINOR=.*/VERSION_MINOR=${min}/" "$file"
            sed -i -E "s/^VERSION_PATCH=.*/VERSION_PATCH=${pat}/" "$file"
          else
            ./gradlew incrementPatch -q
          fi
          next_name=$(./gradlew -q printVersion)
          next_code=$(./gradlew -q printVersionCode)
          if [ -n "${PLAY_STORE_SERVICE_ACCOUNT_JSON:-}" ]; then
            npm install --ignore-scripts --no-save google-auth-library@9.15.1 googleapis@144.0.0
            PLAY_MAX=$(node scripts/get-play-version-code.mjs com.presencial.app)
            if [ "$PLAY_MAX" -ge "$next_code" ]; then
              TARGET=$((PLAY_MAX + 1))
              ./gradlew syncReleaseVersion -PtargetVersionCode="$TARGET" -q
              next_name=$(./gradlew -q printVersion)
              next_code=$(./gradlew -q printVersionCode)
            fi
          fi
          echo "code=${next_code}" >> "$GITHUB_OUTPUT"
          echo "name=${next_name}" >> "$GITHUB_OUTPUT"
          echo "Version → ${next_name} (${next_code})"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON não configurado. O AAB de release sai sem Crashlytics."
            exit 0
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Run CI verification
        if: ${{ github.event_name == 'push' || inputs.run_verify }}
        run: ./gradlew verifyCi --stacktrace --no-configuration-cache

      - name: Bundle release
        run: |
          ./gradlew :app:bundleRelease --stacktrace --no-configuration-cache \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
            -Pandroid.injected.signing.store.password=$ANDROID_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release-aab-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Locate native debug symbols
        id: native_symbols
        run: |
          set -euo pipefail
          zip="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          if [ -f "$zip" ]; then
            echo "path=$zip" >> "$GITHUB_OUTPUT"
            echo "Found $zip ($(wc -c < "$zip") bytes)"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem native-debug-symbols.zip. O mapping.txt (R8) cobre stack Kotlin/Java."
          fi

      - name: Upload native debug symbols artifact
        if: ${{ steps.native_symbols.outputs.path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-debug-symbols-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: ${{ steps.native_symbols.outputs.path }}
          if-no-files-found: ignore

      - name: Commit and push version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          if git diff --cached --quiet; then
            echo "Nada para commitar"
            exit 0
          fi
          git commit -m "chore(release): ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            git push origin "HEAD:main"
          fi

      - name: Publish to Play internal testing
        if: ${{ env.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' && (github.event_name != 'workflow_dispatch' || !inputs.skip_play_upload) }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.presencial.app
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: ${{ env.PLAY_RELEASE_STATUS }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          debugSymbols: ${{ steps.native_symbols.outputs.path }}
          whatsNewDirectory: distribution/whatsnew

      - name: Scrub keystore
        if: always()
        run: rm -f release.jks
