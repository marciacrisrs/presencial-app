name: Android Release

on:
  workflow_run:
    workflows:
      - Android CI
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    name: Build & Upload Internal Testing

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')

    runs-on: ubuntu-latest

    environment: play-internal

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          node-version: 20

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Resolve version code from Play Store
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          npm install --ignore-scripts --no-save google-auth-library@9.15.1 googleapis@144.0.0
          PLAY_MAX_CODE=$(node scripts/get-play-version-code.mjs com.presencial.app)
          LOCAL_CODE=$(./gradlew -q printVersionCode)
          TARGET_CODE=$(( PLAY_MAX_CODE > LOCAL_CODE ? PLAY_MAX_CODE + 1 : LOCAL_CODE + 1 ))
          echo "Play max versionCode: $PLAY_MAX_CODE"
          echo "Local versionCode: $LOCAL_CODE"
          echo "Target versionCode: $TARGET_CODE"
          ./gradlew syncReleaseVersion -PtargetVersionCode=$TARGET_CODE

      - name: Ler versão gerada
        id: version
        run: |
          echo "name=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"
          echo "code=$(./gradlew -q printVersionCode)" >> "$GITHUB_OUTPUT"

      - name: Persist version bump before build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }}) [skip ci]"
          git push origin HEAD:main

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build Signed Release AAB
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
            -Pandroid.injected.signing.store.password=$ANDROID_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Upload Release Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: presencial-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.presencial.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: v${{ steps.version.outputs.name }}
          tracks: internal
          status: completed

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.name }}"
          git push origin "v${{ steps.version.outputs.name }}"
