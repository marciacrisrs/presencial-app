name: Fix CycloneDX verification metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add CycloneDX 3.3.0 verification entries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("gradle/verification-metadata.xml")
          text = path.read_text()

          marker = '<component group="org.cyclonedx.bom" name="org.cyclonedx.bom.gradle.plugin" version="3.3.0">'
          if marker not in text:
              entry = '''      <component group="org.cyclonedx.bom" name="org.cyclonedx.bom.gradle.plugin" version="3.3.0">\n         <artifact name="org.cyclonedx.bom.gradle.plugin-3.3.0.pom">\n            <sha256 value="f59df2c670269e7f5e3d9b2b539b9f435db5e88a2d545ab4811f2217d2cc5c68" origin="Generated by Gradle"/>\n         </artifact>\n      </component>\n'''
              text = text.replace('   </components>', entry + '   </components>')

          plugin_marker = '<component group="org.cyclonedx" name="cyclonedx-gradle-plugin" version="3.3.0">'
          if plugin_marker not in text:
              entry = '''      <component group="org.cyclonedx" name="cyclonedx-gradle-plugin" version="3.3.0">\n         <artifact name="cyclonedx-gradle-plugin-3.3.0.jar">\n            <sha256 value="9bf283e7e451cedf536b263733cf4ddca2329b3cffe19a05ccb8cc1f90a098e8" origin="Generated by Gradle"/>\n         </artifact>\n         <artifact name="cyclonedx-gradle-plugin-3.3.0.module">\n            <sha256 value="92c20482c05782eec05b9c0db1b2ed615160147e52c179c3e080538103e26239" origin="Generated by Gradle"/>\n         </artifact>\n      </component>\n'''
              text = text.replace('   </components>', entry + '   </components>')

          path.write_text(text)
          PY

      - name: Commit metadata and remove fixer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml .github/workflows/fix-cyclonedx-verification.yml
          git rm .github/workflows/fix-cyclonedx-verification.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(build): verify CycloneDX 3.3.0 artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
