name: Dependency Locks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    name: Generate dependency locks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Generate lockfiles
        run: |
          chmod +x gradlew
          ./gradlew resolveAndLockAll --write-locks --stacktrace --no-daemon

      - name: Commit generated lockfiles
        run: |
          if git diff --quiet --exit-code -- '**/gradle.lockfile' '**/buildscript-gradle.lockfile'; then
            echo "Dependency lockfiles are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/gradle.lockfile' '**/buildscript-gradle.lockfile'
          git commit -m "build: update Gradle dependency locks"
          git push
