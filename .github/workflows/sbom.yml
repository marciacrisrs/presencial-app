name: SBOM

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate dependency verification metadata
        run: ./gradlew help --write-verification-metadata sha256 --no-daemon

      - name: Commit generated verification metadata
        shell: bash
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "fix(build): update dependency verification metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --stacktrace --no-daemon

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: presencial-sbom
          path: build/reports/cyclonedx/**
          if-no-files-found: error
          retention-days: 30
