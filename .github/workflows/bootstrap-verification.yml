name: Bootstrap dependency verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate verification metadata
        run: ./gradlew help --write-verification-metadata sha256 --no-daemon

      - name: Commit generated metadata and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git rm .github/workflows/bootstrap-verification.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(build): update dependency verification metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
