name: Bootstrap Kover verification metadata

on:
  push:
    branches:
      - cursor/critical-bug-management-9b9b

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate verification metadata
        run: ./gradlew cyclonedxBom --dependency-verification=lenient --write-verification-metadata sha256 --stacktrace --no-daemon

      - name: Commit metadata and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git rm .github/workflows/bootstrap-kover-verification.yml
          if git diff --cached --quiet; then
            echo "No verification metadata changes generated."
            exit 1
          fi
          git commit -m "fix(build): verify Kover JVM agent metadata"
          git push origin HEAD:${GITHUB_REF_NAME}
