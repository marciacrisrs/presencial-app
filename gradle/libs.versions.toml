ksp = "2.3.11"
hilt = "2.60.1"
room = "2.8.4"
work = "2.11.2"
glance = "1.1.1"
playServicesLocation = "21.4.0"
accompanist = "0.37.3"
lottie = "6.7.1"
coroutines = "1.11.0"
navigation = "2.9.8"
splashscreen = "1.2.0"
datastore = "1.2.1"
hiltNavigationCompose = "1.4.0"
hiltWork = "1.4.0"
runtime = "1.11.4"
material3 = "1.4.0"
